# The same two endpoints on the engine packed from this checkout. Set
# QUALIFY_RELAY_ONLY=true to start the primary with irohRelayOnly.
name: beignet-iroh-qualification
services:
  primary:
    image: beignet-iroh-qualification:local
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: beignet-iroh-primary
    labels:
      beignet.test: iroh-qualification
    environment:
      QUALIFY_ENGINE: local
      QUALIFY_RELAY_ONLY: ${QUALIFY_RELAY_ONLY:-false}
    volumes:
      - .:/fixture:ro
      - ./primary-data:/data
    networks: [qualification]
  phone:
    image: beignet-iroh-qualification:local
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: beignet-iroh-phone
    labels:
      beignet.test: iroh-qualification
    cap_add: [NET_ADMIN]
    environment:
      QUALIFY_ENGINE: local
    volumes:
      - .:/fixture:ro
      - ./phone-data:/data
    networks: [qualification]
networks:
  qualification:
    name: beignet-iroh-qualification
    labels:
      beignet.test: iroh-qualification
