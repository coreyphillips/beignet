name: tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

jobs:
  tests:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run regtest setup
        run: cd docker && docker compose up --quiet-pull -d

      - name: Wait for bitcoind
        run: |
          sudo apt install wait-for-it
          wait-for-it -h 127.0.0.1 -p 43782 -t 60

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      # NOT a port check: Docker publishes 60001 the moment the container
      # starts, so `wait-for-it` returned "available after 0 seconds" while
      # electrs was still starting, and the wallet suite opened its first
      # real connection into a server that was not answering yet. This probe
      # requires a server.version answer and a tip that has caught up with
      # bitcoind, which is what the wallet tests actually depend on.
      - name: Wait for electrum server
        run: node scripts/wait-for-electrum.js 127.0.0.1 60001 180

      - name: Install Node.js dependencies
        run: npm ci

      # Run each suite in its own process so the on-chain wallet tests get a
      # fresh Electrum connection (they previously failed when run after the
      # lightning/CLI suites in one long process). Interop tests are excluded
      # here — they need LND/CLN/Eclair and run via `npm run test:interop`.
      - name: Run on-chain wallet tests
        run: npm run build && npx mocha --exit -r ts-node/register --ignore 'tests/watch-only.test.ts' --ignore 'tests/psbt-flow.test.ts' --ignore 'tests/utxo-freeze.test.ts' --ignore 'tests/wallet-metadata.test.ts' --ignore 'tests/multi-account.test.ts' --ignore 'tests/descriptors.test.ts' --ignore 'tests/multisig.test.ts' --ignore 'tests/getutxos-address-type-scan.test.ts' --ignore 'tests/electrum-connect-failure.test.ts' --ignore 'tests/refresh-wallet-lifecycle.test.ts' --ignore 'tests/electrum-switch-network.test.ts' 'tests/*.test.ts'

      # Offline suites that intentionally point wallets at an unreachable
      # Electrum port. rn-electrum-client keeps module-global client state, so
      # they must not share a process with the live-Electrum wallet tests.
      - name: Run watch-only and PSBT tests (isolated)
        run: npx mocha --exit -r ts-node/register tests/watch-only.test.ts tests/psbt-flow.test.ts tests/utxo-freeze.test.ts tests/wallet-metadata.test.ts tests/multi-account.test.ts tests/descriptors.test.ts tests/multisig.test.ts tests/getutxos-address-type-scan.test.ts tests/electrum-connect-failure.test.ts tests/refresh-wallet-lifecycle.test.ts

      # Own process: the real switchNetwork lifecycle wedges when any other
      # wallet's failed-connect residue occupies rn-electrum-client's
      # module-global state.
      - name: Run network-switch test (isolated process)
        run: npx mocha --exit -r ts-node/register tests/electrum-switch-network.test.ts

      # Also covered by the test:lightning glob below; a named step makes the
      # conformance gate visible in CI output instead of incidental. It must
      # run BEFORE test:lightning: a conformance failure inside that broader
      # step would fail there first and skip a later named step.
      - name: Run BOLT conformance vectors
        run: npm run test:conformance

      # Parallel workers, one test file each, with ts-node in transpile-only mode
      # (the "ts-node" key in tsconfig.json). Types are still gated: type-check.yml
      # runs tsc over src AND tests on the same events, so the per-file
      # LanguageService pass this step used to make was duplicated work.
      # The eight in-process recovery kill matrices used to be covered here by
      # falling inside the glob; they now run in the `chaos` job below, and the
      # two file sets together are exactly the set this step used to cover.
      - name: Run lightning unit tests
        run: npm run test:lightning

      # The process-level chaos matrix SIGKILLs a real LightningNode child
      # (built against dist) at every recorded boundary; its cost and any
      # flakes stay visible in their own step instead of hiding inside the
      # lightning suite.
      - name: Run SIGKILL chaos matrix
        run: npm run test:sigkill

      - name: Run CLI unit tests
        run: npm run test:cli

      # daemon-security and daemon-integration need the live Electrum the
      # regtest stack already provides; test:cli deliberately excludes them.
      - name: Run daemon security and integration tests
        run: npm run test:integration

      - name: Dump docker logs on failure
        if: failure()
        uses: jwalton/gh-docker-logs@v2

  # Its own job rather than another step in `tests`: these eight in-process kill
  # matrices are the most expensive thing in the repo (~9 minutes for 30 tests,
  # because runKillMatrix replays a whole scenario from scratch once per recorded
  # boundary). As a step they would simply stay on the critical path they were
  # already on. Nothing here needs docker or dist, so the job skips both: only
  # recovery-phase7-sigkill.test.ts spawns a child built against dist, and that
  # stays in the `tests` job's test:sigkill step. They stay serial too, because
  # helpers/chaos-quorum.ts holds one current-run trio per process.
  chaos:
    name: Run recovery chaos matrix
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run recovery chaos matrix
        run: npm run test:chaos
