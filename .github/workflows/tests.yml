name: tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A new push to a pull request cancels that pull request's run in progress.
# Every other event gets a group of its own (the run id), so master pushes
# never wait on or cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# c8 coverage summaries on master pushes and manual runs only. Coverage is
# information, not a gate (.c8rc.json sets no threshold, and c8 exits with
# mocha's code), so pull requests skip its cost. Used unquoted as a command
# prefix, so it expands to nothing on a pull request.
env:
  C8: ${{ github.event_name != 'pull_request' && 'npx c8' || '' }}

jobs:
  tests:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run regtest setup
        run: cd docker && docker compose up --quiet-pull -d

      # A bash /dev/tcp probe rather than wait-for-it, which came unpinned
      # from the apt mirror.
      - name: Wait for bitcoind
        run: |
          timeout 60 bash -c 'until (: > /dev/tcp/127.0.0.1/43782) 2>/dev/null; do sleep 1; done'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          cache: 'npm'

      # NOT a port check: Docker publishes 60001 the moment the container
      # starts, so a port check returned "available after 0 seconds" while
      # electrs was still starting, and the wallet suite opened its first
      # real connection into a server that was not answering yet. This probe
      # requires a server.version answer and a tip that has caught up with
      # bitcoind, which is what the wallet tests actually depend on.
      - name: Wait for electrum server
        run: node scripts/wait-for-electrum.js 127.0.0.1 60001 180

      - name: Install Node.js dependencies
        run: npm ci

      # Run each suite in its own process so the on-chain wallet tests get a
      # fresh Electrum connection (they previously failed when run after the
      # lightning/CLI suites in one long process). Interop tests are excluded
      # here — they need LND/CLN/Eclair and run via `npm run test:interop`.
      - name: Run on-chain wallet tests
        run: npm run build && npx mocha --exit -r ts-node/register --ignore 'tests/watch-only.test.ts' --ignore 'tests/psbt-flow.test.ts' --ignore 'tests/utxo-freeze.test.ts' --ignore 'tests/wallet-metadata.test.ts' --ignore 'tests/multi-account.test.ts' --ignore 'tests/descriptors.test.ts' --ignore 'tests/multisig.test.ts' --ignore 'tests/getutxos-address-type-scan.test.ts' --ignore 'tests/electrum-connect-failure.test.ts' --ignore 'tests/refresh-wallet-lifecycle.test.ts' --ignore 'tests/wallet-stop-deadline.test.ts' --ignore 'tests/reorged-transaction.test.ts' --ignore 'tests/broadcast-spent-utxos.test.ts' --ignore 'tests/wallet-save-queue.test.ts' --ignore 'tests/wallet-create-error.test.ts' --ignore 'tests/electrum-switch-network.test.ts' --ignore 'tests/unresolved-input.test.ts' --ignore 'tests/wallet-storage-write-failure.test.ts' --ignore 'tests/address-scan-during-refresh.test.ts' --ignore 'tests/remain-offline.test.ts' 'tests/*.test.ts'

      # Offline suites that intentionally point wallets at an unreachable
      # Electrum port. rn-electrum-client keeps module-global client state, so
      # they must not share a process with the live-Electrum wallet tests.
      - name: Run watch-only and PSBT tests (isolated)
        run: npx mocha --exit -r ts-node/register tests/watch-only.test.ts tests/psbt-flow.test.ts tests/utxo-freeze.test.ts tests/wallet-metadata.test.ts tests/multi-account.test.ts tests/descriptors.test.ts tests/multisig.test.ts tests/getutxos-address-type-scan.test.ts tests/electrum-connect-failure.test.ts tests/refresh-wallet-lifecycle.test.ts tests/wallet-stop-deadline.test.ts tests/reorged-transaction.test.ts tests/broadcast-spent-utxos.test.ts tests/wallet-save-queue.test.ts tests/wallet-create-error.test.ts tests/unresolved-input.test.ts tests/wallet-storage-write-failure.test.ts tests/address-scan-during-refresh.test.ts tests/remain-offline.test.ts

      # Own process: the real switchNetwork lifecycle wedges when any other
      # wallet's failed-connect residue occupies rn-electrum-client's
      # module-global state.
      - name: Run network-switch test (isolated process)
        run: npx mocha --exit -r ts-node/register tests/electrum-switch-network.test.ts

      # Also covered by the lightning shard jobs below; a named step makes the
      # conformance gate visible in this job's output instead of incidental.
      - name: Run BOLT conformance vectors
        run: npm run test:conformance

      - name: Run direct-funding SDK and package tests
        run: npm run test:direct-funding

      # The rest of test:lightning runs in the `lightning` shard jobs, which
      # need neither docker nor dist. The files left here need this job's
      # bitcoind and Electrum; scripts/shard-tests.js lists them and runs them
      # with the test:lightning flags.
      - name: Run lightning tests that need the regtest stack
        run: node scripts/shard-tests.js --regtest

      # test:sigkill and test:cli used to run here. They were 325s and 230s of a
      # 17m30s job that is the whole workflow's critical path, and neither needs
      # the regtest stack: recovery-phase7-sigkill.test.ts references no electrum,
      # bitcoind or docker port (it needs dist, which its own script builds), and
      # every docker-shaped string left in the test:cli set is a literal in a
      # type-shape assertion, not a connection. They are now the `sigkill` and
      # `cli` jobs below, which run beside this one instead of inside it.

      # daemon-security and daemon-integration need the live Electrum the
      # regtest stack already provides; test:cli deliberately excludes them.
      - name: Run daemon security and integration tests
        run: npm run test:integration

      - name: Dump docker logs on failure
        if: failure()
        uses: jwalton/gh-docker-logs@2741064ab9d7af54b0b1ffb6076cf64c16f0220e # v2.2.2

  # test:lightning, sharded. Mocha never splits a file across workers, so the
  # slowest file is the floor of any one job. scripts/shard-tests.js fills the
  # shards from scripts/test-durations.json and runs each with the
  # test:lightning flags; --verify fails the job unless every test:lightning
  # file is in exactly one shard or the regtest step above. The shard count is
  # in both the matrix and SHARDS: change them together.
  lightning:
    name: Run lightning unit tests (${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SHARDS: 4

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Check every lightning file is in exactly one job
        run: node scripts/shard-tests.js --shards $SHARDS --verify

      - name: Run lightning unit tests
        run: $C8 node scripts/shard-tests.js --shards $SHARDS --shard ${{ matrix.shard }}

  # Its own job rather than another step in `tests`: these eight in-process kill
  # matrices are the most expensive thing in the repo (~9 minutes for 30 tests,
  # because runKillMatrix replays a whole scenario from scratch once per recorded
  # boundary). As a step they would simply stay on the critical path they were
  # already on. Nothing here needs docker or dist, so the job skips both: only
  # recovery-phase7-sigkill.test.ts spawns a child built against dist, and that
  # has its own `sigkill` job below.
  #
  # test:chaos now runs --parallel. helpers/chaos-quorum.ts still holds one
  # current-run per process, and that still holds: mocha gives each file to a
  # worker and never runs two files at once inside one worker, so no two runs
  # are ever live in the same process. 30/30 both ways, and stressed over 11
  # runs at --jobs 2 through 8 plus three probes under CPU hogs, 0 failures.
  # The floor is one test: "S2 forwarder ... in quorum mode" alone is 66.1s of
  # the suite's 204.7s, so extra workers beyond a few buy nothing here.
  chaos:
    name: Run recovery chaos matrix
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run recovery chaos matrix
        run: npm run test:chaos

  # Split out of the `tests` job, which was 17m30s of serial steps and the whole
  # workflow's critical path. This is the single most expensive step in the repo
  # after the chaos matrix (325s), and it only needs a build, so it has no
  # reason to queue behind the regtest stack.
  sigkill:
    name: Run SIGKILL chaos matrix
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      # test:sigkill runs npm run build itself; the child it SIGKILLs is loaded
      # from dist by path, so the build is not optional here.
      - name: Run SIGKILL chaos matrix
        run: npm run test:sigkill

  # Also split out of `tests` (230s there). test:cli excludes daemon-security and
  # daemon-integration, which are the only CLI files that want a live Electrum,
  # so this job needs no docker. Those two keep running in the `tests` job via
  # test:integration.
  cli:
    name: Run CLI unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      # The spawn tests run dist/cli/cli.js, and fail if it is missing or older
      # than src.
      - name: Build
        run: npm run build

      - name: Run CLI unit tests
        run: $C8 npm run test:cli
