name: type-check

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A new push to a pull request cancels that pull request's run in progress.
# Every other event gets a group of its own (the run id), so master pushes
# never wait on or cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typescript:
    name: Run type check
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Type check
        run: npm run tsc:check

      # Emits the declarations in memory, so it needs no build. A PR that
      # means to change the public API commits the regenerated snapshot
      # (npm run api:snapshot) and the diff is reviewed with it.
      - name: Check the exported API snapshot
        run: npm run test:api

      # Several tests import the package root, whose types entry resolves to
      # dist/types/index.d.ts, so dist must exist before tests are checked.
      - name: Build
        run: npm run build

      - name: Type check tests and scripts
        run: npm run tsc:check:tests
