name: type-check

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

jobs:
  typescript:
    name: Run type check
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Type check
        run: npm run tsc:check

      # Several tests import the package root, whose types entry resolves to
      # dist/types/index.d.ts, so dist must exist before tests are checked.
      - name: Build
        run: npm run build

      - name: Type check tests and scripts
        run: npm run tsc:check:tests
