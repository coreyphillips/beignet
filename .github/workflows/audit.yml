name: audit

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  audit:
    name: Run npm audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      # npm audit resolves the dependency graph from package-lock.json and
      # queries the registry advisory endpoint; no npm ci needed.
      # Moderate, not high: bip21 parses QR and pasted URIs with qs, and qs's
      # denial-of-service advisories are rated moderate.
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
