name: audit

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]
  # Weekly as well: an advisory published against an unchanged lockfile
  # fails here before it fails someone's unrelated pull request.
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

# A new push to a pull request cancels that pull request's run in progress.
# Every other event gets a group of its own (the run id), so master pushes
# never wait on or cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: Run npm audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1

      # npm audit resolves the dependency graph from package-lock.json and
      # queries the registry advisory endpoint; no npm ci needed.
      # Moderate, not high: bip21 parses QR and pasted URIs with qs, and qs's
      # denial-of-service advisories are rated moderate.
      #
      # Two gates. The first covers what ships, with no exceptions. The second
      # covers everything, the test and lint tools included, and takes the
      # named, dated exceptions in audit-allowlist.json (scripts/audit-gate.js
      # states the rules), so an advisory no dependent has fixed yet is
      # excepted by name until a date rather than failing every run or having
      # the gate switched off.
      - name: Audit the dependencies that ship
        run: npm audit --audit-level=moderate --omit=dev

      # Runs even when the first gate fails, so the job summary always lists
      # the exceptions and the days each has left.
      - name: Audit everything, with the exceptions in audit-allowlist.json
        if: ${{ !cancelled() }}
        run: node scripts/audit-gate.js
