name: audit

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

jobs:
  audit:
    name: Run npm audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      # npm audit resolves the dependency graph from package-lock.json and
      # queries the registry advisory endpoint; no npm ci needed.
      - name: Audit dependencies
        run: npm audit --audit-level=high
